name: Deploy theme to SiteGround staging

# Syncs the theme to the staging WordPress site (pmc.yroc.host) on SiteGround over SSH.
# Runs on every push to main or the working branch that touches the theme,
# or manually from the Actions tab.
on:
  push:
    branches:
      - main
      - claude/modest-sagan-6ge40q
    paths:
      - 'wp-content/themes/progressive-marketing/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
      SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
      SSH_PORT: ${{ vars.SITEGROUND_SSH_PORT || '18765' }}
      THEME_DIR: ${{ vars.SITEGROUND_THEME_DIR || 'www/pmc.yroc.host/public_html/wp-content/themes/progressive-marketing/' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Lint PHP
        run: |
          for f in $(find wp-content/themes/progressive-marketing -name '*.php'); do
            php -l "$f" > /dev/null || exit 1
          done

      - name: Check secrets are set
        env:
          HAS_KEY: ${{ secrets.SITEGROUND_SSH_KEY != '' }}
        run: |
          missing=0
          for v in SSH_HOST SSH_USER; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; missing=1; fi
          done
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Missing secret SITEGROUND_SSH_KEY"; missing=1; fi
          exit $missing

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.SITEGROUND_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Normalize line endings in case the key was pasted from Windows.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/siteground
          chmod 600 ~/.ssh/siteground
          # SiteGround-generated keys have a passphrase: remove it on the runner copy.
          if [ -n "$SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_PASSPHRASE" -N "" -f ~/.ssh/siteground > /dev/null
          fi
          if ! ssh-keygen -y -P "" -f ~/.ssh/siteground > ~/.ssh/siteground.pub 2>/dev/null; then
            echo "::error::SITEGROUND_SSH_KEY is not a usable private key, or it has a passphrase. Add the passphrase as the SITEGROUND_SSH_PASSPHRASE secret, or use a key created without one."
            exit 1
          fi
          echo "Deploy key fingerprint (compare with the key in SiteGround's SSH Keys Manager):"
          ssh-keygen -lf ~/.ssh/siteground.pub
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync theme
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/siteground -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$THEME_DIR'"
          rsync -az --delete --exclude '.git*' --exclude '.DS_Store' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -i $HOME/.ssh/siteground -p $SSH_PORT" \
            wp-content/themes/progressive-marketing/ \
            "$SSH_USER@$SSH_HOST:$THEME_DIR"

      - name: Activate theme (first deploy only) and flush cache
        run: |
          WP_DIR="${THEME_DIR%/wp-content/themes/progressive-marketing/}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/siteground -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- "$WP_DIR" <<'REMOTE'
          set -e
          cd "$1"
          if ! command -v wp >/dev/null 2>&1; then
            echo "::warning::WP-CLI not found on the server; activate the theme in WordPress admin."
            exit 0
          fi
          if ! wp core is-installed 2>/dev/null; then
            echo "::warning::WordPress is not installed at $1 yet."
            exit 0
          fi
          if [ "$(wp option get stylesheet)" != "progressive-marketing" ]; then
            wp theme activate progressive-marketing
            echo "Theme activated."
          else
            echo "Theme already active."
          fi
          # Create any missing pages/menus (never overwrites existing content).
          wp eval 'if ( function_exists( "pmc_activate" ) ) { pmc_activate(); update_option( "pmc_setup_version", PMC_VERSION ); echo "Pages and menus checked.\n"; }'
          wp rewrite flush --hard 2>/dev/null || wp rewrite flush
          if [ "$(wp option get blogname)" = "My WordPress" ] || [ "$(wp option get blogname)" = "My Blog" ]; then
            wp option update blogname "Progressive Marketing Concepts"
          fi
          wp sg purge 2>/dev/null || wp cache flush 2>/dev/null || true
          REMOTE

      - name: Warm up site (runs first-time page setup)
        continue-on-error: true
        run: |
          SITE="https://$(basename "${THEME_DIR%/public_html/wp-content/themes/progressive-marketing/}")"
          curl -s -o /dev/null -w "Home: %{http_code}\n" "$SITE/"
          curl -s -o /dev/null -w "llms.txt: %{http_code}\n" "$SITE/llms.txt"
          curl -s -o /dev/null -w "Services: %{http_code}\n" "$SITE/services/"
